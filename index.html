<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="أوفرسايت - فحص وتقييم هندسي متكامل للمباني السكنية والتجارية بأحدث أجهزة الكشف غير الإتلافي NDT" />
    <title>أوفرسايت | الفحص الهندسي للمباني</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Apply the stored language before first paint. Without this the document
         ships as ar/rtl and an English visitor sees a flash of RTL layout
         before React mounts and corrects it. Kept inline and tiny on purpose. */
      (function () {
        try {
          var l = localStorage.getItem('oversight.lang');
          if (l === 'en' || l === 'ar') {
            var r = document.documentElement;
            r.setAttribute('lang', l);
            r.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
          }
        } catch (e) {
          /* blocked storage — keep the ar/rtl default from the markup */
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
