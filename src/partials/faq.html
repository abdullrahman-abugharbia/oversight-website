  <!-- ====================== FAQ ====================== -->
  <section class="section section--light" id="faq">
    <div class="shell">
      <div class="section-head" data-reveal>
        <span class="eyebrow" data-i18n="faq.eyebrow">الأسئلة الشائعة</span>
        <h2 class="h-md" data-i18n="faq.h2">ابحث عن إجابات للاستفسارات الشائعة</h2>
      </div>

      <div class="faq" data-reveal>
        <div class="faq__item" data-open="true">
          <button class="faq__q" type="button">
            <span data-i18n="faq.q1">هل يتطلب الفحص الهندسي أي تكسير أو إتلاف في العقار؟</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="faq__a"><div><p data-i18n="faq.a1">إطلاقاً. نعتمد بنسبة ١٠٠٪ على تقنيات الفحص غير المتلف (NDT).</p></div></div>
        </div>
        <div class="faq__item" data-open="false">
          <button class="faq__q" type="button">
            <span data-i18n="faq.q2">هل يجب أن أتواجد شخصياً في العقار أثناء عملية الفحص؟</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="faq__a"><div><p data-i18n="faq.a2">لا، وجودك غير إلزامي.</p></div></div>
        </div>
        <div class="faq__item" data-open="false">
          <button class="faq__q" type="button">
            <span data-i18n="faq.q3">هل خدمات فحص أوفرسايت تغطي البيوت القديمة والمستعملة أم الجديدة فقط؟</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="faq__a"><div><p data-i18n="faq.a3">نغطي الاثنين.</p></div></div>
        </div>
        <div class="faq__item" data-open="false">
          <button class="faq__q" type="button">
            <span data-i18n="faq.q4">ما الفرق بين الفحص بالعين المجردة والفحص بأجهزة أوفرسايت التقنية؟</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="faq__a"><div><p data-i18n="faq.a4">العين المجردة ترى النتيجة النهائية فقط.</p></div></div>
        </div>
        <div class="faq__item" data-open="false">
          <button class="faq__q" type="button">
            <span data-i18n="faq.q5">ما هي المدن والمناطق التي تغطيها خدمات فحص أوفرسايت؟</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="faq__a"><div><p data-i18n="faq.a5">مقرّنا الرئيسي في الرياض.</p></div></div>
        </div>
        <div class="faq__item" data-open="false">
          <button class="faq__q" type="button">
            <span data-i18n="faq.q6">كيف يفيدني التقرير في التفاوض على سعر العقار؟</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="faq__a"><div><p data-i18n="faq.a6">التقرير يحوّل الملاحظات إلى أرقام.</p></div></div>
        </div>
      </div>
    </div>
  </section>
